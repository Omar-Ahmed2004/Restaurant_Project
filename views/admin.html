<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="admin-navbar">

        <div class="logo">
            Restaurant Admin
        </div>

        <button id="logout-btn">
            Logout
        </button>

    </header>


    <main class="admin-container">

        <div class="admin-header">

            <div>
                <p class="small-title">ADMIN PANEL</p>
                <h1>Manage Products</h1>
            </div>

            <button id="add-product-btn" class="primary-btn">
                Add Product
            </button>

        </div>


        <section class="products-section">

            <div id="admin-products-container">
            </div>

        </section>


        <section id="product-form-section" class="product-form-section">

            <h2 id="form-title">Add Product</h2>

            <form id="product-form">

                <input
                    type="text"
                    id="product-name"
                    placeholder="Product name"
                    required
                >

                <textarea
                    id="product-description"
                    placeholder="Product description"
                    required
                ></textarea>

                <input
                    type="number"
                    id="product-price"
                    placeholder="Price"
                    step="0.01"
                    min="0"
                    required
                >

                <input
                    type="file"
                    id="product-image"
                    accept="image/*"
                >

                <select id="product-availability">

                    <option value="true">
                        Available
                    </option>

                    <option value="false">
                        Unavailable
                    </option>

                </select>

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Product
                    </button>

                    <button
                        type="button"
                        id="cancel-btn"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

            <p id="form-message"></p>

        </section>

        <section class="admin-orders">

            <div class="admin-section-header">

                <div>
                    <p>ORDER MANAGEMENT</p>
                    <h2>Customer Orders</h2>
                </div>

                <button id="refresh-orders" class="admin-action-btn">
                    Refresh
                </button>

            </div>


            <div id="admin-orders-container">

                <p class="orders-loading">
                    Loading orders...
                </p>

            </div>

        </section>

    </main>


    <script src="/js/admin.js"></script>

</body>

</html>
