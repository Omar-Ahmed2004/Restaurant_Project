<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <h1>Admin Login</h1>

            <p>Login to manage the restaurant.</p>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-message"></p>

        </div>

    </main>

    <script src="/js/login.js"></script>

</body>

</html>
